<script>
const $=id=>document.getElementById(id);
const icon=name=>`<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mail=[
{id:1,sender:'Maya Chen',initial:'M',address:'maya@fieldwork.example',account:'work',subject:'周一，我们从这里开始',snippet:'时间确认好了，带上你的想法就好。',time:'昨天',unread:false,pinned:true,folder:'inbox',body:['Alex，','周一上午十点，我们在工作室碰面。先一起看看这期的印刷样张，再聊聊冬季刊。','时间确认好了，带上你的想法就好。'],signature:'Maya',studio:'FIELDWORK STUDIO'},
{id:2,sender:'林 皓',initial:'林',address:'lin@fieldwork.example',account:'work',subject:'秋季刊，最后一遍校样',snippet:'封面和内页都准备好了，想听听你的意见。',time:'10:42',unread:true,pinned:false,folder:'inbox',body:['Alex，早上好。','新版校样整理好了。封面用了更温暖的纸色，内页留白也稍微放大了一些。','想请你最后看一遍，尤其是第 12 页的照片顺序。如果没有其他调整，我们周一就可以送印。','不用急，周末前回我就好。'],signature:'林皓',studio:'FIELDWORK STUDIO',attachment:'Fieldwork — 秋季刊.pdf',size:'8.4 MB',history:'收到样张了，纸张的手感比预期更好。'},
{id:3,sender:'Oliver Park',initial:'O',address:'oliver@park.example',account:'work',subject:'A few thoughts on the next chapter',snippet:'Thank you for the conversation yesterday.',time:'09:18',unread:true,pinned:false,folder:'inbox',body:['Hi Alex,','Thank you for the conversation yesterday. I kept thinking about the small details we discussed.','I put a few references together. Let’s find a quiet hour next week to go through them.'],signature:'Oliver',studio:'PARK & CO.'},
{id:4,sender:'Yuki',initial:'Y',address:'yuki@personal.example',account:'personal',subject:'周末，去海边走走？',snippet:'找到一家很小的咖啡店，就在灯塔旁边。',time:'08:56',unread:true,pinned:false,folder:'inbox',body:['周六有空吗？','找到一家很小的咖啡店，就在灯塔旁边。天气好的话，我们可以沿着海岸慢慢走过去。','我带相机，你选音乐。'],signature:'Yuki'},
{id:5,sender:'Linear',initial:'L',address:'notifications@linear.example',account:'work',subject:'本周的项目更新',snippet:'网站更新 · 3 个问题已解决',time:'昨天',unread:false,pinned:false,folder:'inbox',body:['本周的工作已整理。','网站的图片加载和移动端排版已经调整完成，剩余两项将在下周一起检查。'],signature:'Linear'},
{id:6,sender:'The Modern House',initial:'M',address:'journal@modernhouse.example',account:'personal',subject:'A slower kind of Sunday',snippet:'Spaces for living, and room to pause.',time:'昨天',unread:false,pinned:false,folder:'bundle',body:['A slower kind of Sunday.','This week, we visit a home where light and space do most of the talking. A place made for everyday rituals.'],signature:'The Modern House'},
{id:7,sender:'Dense Discovery',initial:'D',address:'hello@dense.example',account:'personal',subject:'Ideas worth keeping · № 312',snippet:'A small collection of considered things.',time:'昨天',unread:false,pinned:false,folder:'bundle',body:['A small collection of considered things.','This week: independent publishing, walkable cities, and the useful art of doing less.'],signature:'Dense Discovery'},
{id:8,sender:'Jun',initial:'J',address:'jun@studio.example',account:'work',subject:'冬季拍摄的时间',snippet:'明天 09:00 回到收件箱',time:'昨天',unread:false,pinned:false,folder:'snooze',snoozed:'明天 09:00',body:['Alex，','冬季拍摄的日期还可以调整。等你看过场地后，我们再一起确认。'],signature:'Jun'}
];
let view='inbox',account='all',filter='all',selected=2,bundleOpen=false,undoAction=null,toastTimer,previousFocus=null;
const drafts=new Map();
function current(){return mail.find(m=>m.id===selected)}
function matches(m){return (account==='all'||m.account===account)&&(filter==='all'||m.unread)}
function visible(){return mail.filter(m=>matches(m)&&(view==='pin'?m.pinned&&m.folder!=='archive':view==='draft'?drafts.has(m.id):m.folder===view))}
function showToast(text,undo){$('toast-text').textContent=text;undoAction=undo||null;$('undo').hidden=!undo;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,5500)}
function threadHTML(m){return `<button class="thread ${m.id===selected?'selected':''} ${m.unread?'unread':''}" data-mail="${m.id}" aria-pressed="${m.id===selected}">${m.unread?'<i class="unread-dot"></i>':''}<div class="row-top"><span class="sender">${escapeHTML(m.sender)}</span>${m.pinned?'<svg class="pin-indicator"><use href="#i-pin"/></svg>':''}${m.history?'<span class="thread-count">2</span>':''}<time>${m.time}</time></div><div class="subject">${escapeHTML(m.subject)}</div><div class="snippet">${escapeHTML(m.folder==='snooze'?m.snoozed+' 回到收件箱':m.snippet)}</div></button>`}
function group(label,items,pin=false){return items.length?`<div class="group-label">${pin?icon('pin'):''}${label}<span class="line"></span></div>${items.map(threadHTML).join('')}`:''}
function renderList(){const items=visible();$('view-title').textContent=({inbox:'收件箱',pin:'置顶',snooze:'稍后处理',archive:'归档',draft:'草稿'})[view];$('view-total').textContent=items.length;$('account-context').textContent=account==='all'?'所有邮箱 · 工作与个人':account==='work'?'工作邮箱 · alex@studio.example':'个人邮箱 · alex@personal.example';$('inbox-count').textContent=mail.filter(m=>m.folder==='inbox').length;$('pin-count').textContent=mail.filter(m=>m.pinned&&m.folder!=='archive').length||'';$('snooze-count').textContent=mail.filter(m=>m.folder==='snooze').length||'';$('draft-count').textContent=drafts.size||'';$('unread-count').textContent=mail.filter(m=>m.folder==='inbox'&&m.unread&&(account==='all'||m.account===account)).length;
let html=view==='inbox'?group('置顶',items.filter(m=>m.pinned),true)+group('今天',items.filter(m=>!m.pinned&&m.time!=='昨天'))+group('更早',items.filter(m=>!m.pinned&&m.time==='昨天')):group(view==='snooze'?'等待回来':'邮件',items);
const bundle=mail.filter(m=>m.folder==='bundle'&&matches(m));if(view==='inbox'&&bundle.length)html+=`<div class="bundle"><button class="bundle-button" id="bundle-toggle" aria-expanded="${bundleOpen}"><span class="bundle-glyph">${icon('book')}</span><span><strong>留给慢慢读</strong><small>Modern House · Dense Discovery</small></span><span class="bundle-count">${bundle.length}</span>${icon('chevron')}</button>${bundleOpen?`<div class="bundle-items">${bundle.map(threadHTML).join('')}</div>`:''}</div>`;
$('message-list').innerHTML=html||'<p class="empty-list">这里暂时没有邮件</p>';
$('message-list').querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>selectMail(Number(b.dataset.mail)));
if($('bundle-toggle'))$('bundle-toggle').onclick=()=>{bundleOpen=!bundleOpen;renderList()};
document.querySelectorAll('[data-nav]').forEach(b=>b.setAttribute('aria-current',b.dataset.nav===view?'page':'false'));
document.querySelectorAll('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));
updateToolbar();}
function updateToolbar(){const m=current();document.querySelectorAll('.mail-action').forEach(b=>b.disabled=!m);$('pin').setAttribute('aria-pressed',String(!!m?.pinned));const list=visible(),i=list.findIndex(x=>x.id===selected);$('position').textContent=i>=0?`${i+1} / ${list.length}`:'';$('previous').disabled=i<=0;$('next').disabled=i<0||i>=list.length-1;}
function renderReader(){const m=current();if(!m){$('letter').innerHTML='<div class="empty-reader" style="min-height:420px">'+icon('check')+'<p>选一封邮件，慢慢读。</p></div>';updateToolbar();return}
$('letter').innerHTML=`<div class="letter-context"><i class="dot ${m.account==='personal'?'personal':''}"></i>${m.account==='work'?'工作邮箱':'个人邮箱'}<span> / </span><span>${m.folder==='snooze'?'稍后处理':m.folder==='archive'?'归档':m.folder==='draft'?'草稿':'收件箱'}</span>${m.pinned?'<span class="context-tag">置顶</span>':''}</div><h2>${escapeHTML(m.subject)}</h2>${m.history?`<details class="history"><summary>${icon('chevron')}<strong>我</strong><span class="history-preview">${escapeHTML(m.history)}</span><time>昨天</time></summary><div class="history-body">${escapeHTML(m.history)}<br>我会在这两天把校样看完，谢谢。<br>Alex</div></details>`:''}<div class="sender-details"><div class="avatar">${m.initial}</div><div class="sender-meta"><div class="sender-name">${escapeHTML(m.sender)}<span class="address">${m.address}</span></div><div class="recipient">${m.to?'发给 '+escapeHTML(m.to):'发给我'} <span>⌄</span></div></div><time class="sender-time">${m.time}</time></div><div class="letter-body">${m.body.map(p=>'<p>'+escapeHTML(p)+'</p>').join('')}<p class="signature">${escapeHTML(m.signature)}${m.studio?'<span>'+m.studio+'</span>':''}</p></div>${m.attachment?`<button class="attachment" id="attachment" title="示例附件信息"><span class="document">PDF</span><span><strong>${m.attachment}</strong><small>${m.size} · PDF 文档</small></span>${icon('download')}</button>`:''}<div class="reply-area" id="reply-area"><button class="reply-trigger" id="reply-trigger">${icon('reply')}回复 ${escapeHTML(m.sender)}<kbd>R</kbd></button><div id="reply-editor" hidden><div class="reply-head">收件人 <strong>${escapeHTML(m.sender)}</strong> · 从${m.account==='work'?'工作':'个人'}邮箱发送</div><textarea id="reply-text" aria-label="回复正文" placeholder="写下你的回复…"></textarea><div class="reply-actions"><span class="saved">仅保存在此原型中</span><button class="primary-button" id="save-draft">保存草稿</button></div></div></div>`;
$('reply-trigger').onclick=openReply;if($('attachment'))$('attachment').onclick=()=>showToast('示例附件 · '+m.attachment+' · '+m.size);
$('save-draft').onclick=()=>{const text=$('reply-text').value.trim();if(!text){showToast('写点内容再保存');return}drafts.set(m.id,text);renderList();showToast('草稿已保存在原型中')};
$('reply-text').value=drafts.get(m.id)||'';updateToolbar();}
function selectMail(id){selected=id;const m=current();if(m)m.unread=false;renderList();renderReader();$('shell').classList.add('reading');$('reader-scroll').scrollTop=0;closeSnooze();}
function setView(next){view=next;filter='all';const items=visible();selected=items[0]?.id??null;renderList();renderReader();$('shell').classList.remove('reading');}
function changeFolder(folder,snoozed){const m=current();if(!m)return;const old={folder:m.folder,snoozed:m.snoozed,id:m.id};m.folder=folder;m.snoozed=snoozed;const list=visible();selected=list[0]?.id??null;renderList();renderReader();closeSnooze();showToast(folder==='archive'?'已归档':`将在${snoozed}回来`,()=>{m.folder=old.folder;m.snoozed=old.snoozed;selected=old.id;renderList();renderReader()});}
function togglePin(){const m=current();if(!m)return;m.pinned=!m.pinned;renderList();renderReader();showToast(m.pinned?'已置顶':'已取消置顶')}
function openReply(){if(!current())return;$('shell').classList.add('reading');$('reply-trigger').hidden=true;$('reply-editor').hidden=false;$('reply-text').focus();$('reply-area').scrollIntoView({block:'nearest'})}
function navigate(delta){const list=visible(),index=list.findIndex(m=>m.id===selected),m=list[index+delta];if(m)selectMail(m.id)}
function openSnooze(){if(!current())return;const anchor=$('snooze').getBoundingClientRect(),bounds=$('app').getBoundingClientRect();$('snooze-menu').style.left=Math.max(8,Math.min(anchor.left-bounds.left-6,bounds.width-250))+'px';$('snooze-menu').style.right='auto';$('snooze-menu').style.top=(anchor.bottom-bounds.top+7)+'px';$('snooze-menu').hidden=!$('snooze-menu').hidden;$('snooze').setAttribute('aria-expanded',String(!$('snooze-menu').hidden));if(!$('snooze-menu').hidden)$('snooze-menu').querySelector('button').focus()}
function closeSnooze(){$('snooze-menu').hidden=true;$('snooze').setAttribute('aria-expanded','false')}
function closePalette(){$('command-modal').hidden=true;previousFocus?.focus()}
const commands=[{name:'归档这封邮件',icon:'archive',key:'E',action:()=>changeFolder('archive')},{name:'稍后处理',icon:'clock',key:'H',action:openSnooze},{name:'置顶 / 取消置顶',icon:'pin',key:'P',action:togglePin},{name:'回复这封邮件',icon:'reply',key:'R',action:openReply},{name:'返回所有邮箱',icon:'inbox',key:'',action:()=>{account='all';setView('inbox')}}];
function paletteResults(){const q=$('command-input').value.trim().toLowerCase();let entries=q?mail.filter(m=>(m.sender+' '+m.subject+' '+m.snippet).toLowerCase().includes(q)).map(m=>({name:m.subject,icon:'file',key:m.sender,action:()=>{account='all';view=m.folder==='bundle'?'inbox':m.folder;filter='all';bundleOpen=m.folder==='bundle';selectMail(m.id)}})):commands;
if(q)entries=entries.concat(commands.filter(c=>c.name.includes(q)));$('palette-results').replaceChildren(...entries.map(entry=>{const b=document.createElement('button');b.innerHTML=icon(entry.icon)+'<span>'+escapeHTML(entry.name)+'</span><kbd>'+escapeHTML(entry.key)+'</kbd>';b.onclick=()=>{closePalette();entry.action()};return b}));if(!entries.length)$('palette-results').innerHTML='<p class="empty-list">没有找到相关邮件或命令</p>'}
function openPalette(){previousFocus=document.activeElement;closeSnooze();$('command-modal').hidden=false;$('command-input').value='';paletteResults();$('command-input').focus()}
$('archive').onclick=()=>changeFolder('archive');$('pin').onclick=togglePin;$('snooze').onclick=openSnooze;$('reply').onclick=openReply;$('previous').onclick=()=>navigate(-1);$('next').onclick=()=>navigate(1);$('back-list').onclick=()=>$('shell').classList.remove('reading');$('search').onclick=openPalette;$('more').onclick=openPalette;$('settings').onclick=openPalette;$('close-palette').onclick=closePalette;$('command-input').oninput=paletteResults;

$('compose').onclick=()=>{previousFocus=document.activeElement;$('compose-modal').hidden=false;$('compose-to').focus()};
$('close-compose').onclick=closeCompose;
$('save-compose').onclick=()=>{const subject=$('compose-subject').value.trim(),text=$('compose-text').value.trim(),to=$('compose-to').value.trim();if(!subject||!text||!to||!$('compose-to').checkValidity()){showToast('请填写有效收件人、主题和正文');return}const id=Math.max(...mail.map(m=>m.id))+1;mail.push({id,sender:'我',initial:'我',address:$('compose-from').value==='work'?'alex@studio.example':'alex@personal.example',account:$('compose-from').value,subject,snippet:text,time:'刚刚',unread:false,pinned:false,folder:'draft',body:text.split('\n').filter(Boolean),signature:'Alex',to});drafts.set(id,text);closeCompose();account='all';setView('draft');selected=id;renderList();renderReader();['compose-to','compose-subject','compose-text'].forEach(id=>$(id).value='');showToast('新邮件已保存为示例草稿')};
$('undo').onclick=()=>{if(undoAction)undoAction();$('toast').hidden=true;undoAction=null};
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{account='all';setView(b.dataset.nav)});document.querySelectorAll('[data-account]').forEach(b=>b.onclick=()=>{account=b.dataset.account;setView('inbox')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderList()});document.querySelectorAll('[data-snooze]').forEach(b=>b.onclick=()=>changeFolder('snooze',b.dataset.snooze));
document.querySelectorAll('.themes button').forEach(b=>b.onclick=()=>{$('app').dataset.theme=b.dataset.theme;document.querySelectorAll('.themes button').forEach(t=>t.setAttribute('aria-pressed',String(t===b)))});
$('command-modal').onclick=e=>{if(e.target===$('command-modal'))closePalette()};
document.addEventListener('click',e=>{if(!$('snooze-menu').contains(e.target)&&!$('snooze').contains(e.target))closeSnooze()});
document.addEventListener('keydown',e=>{if(e.isComposing)return;if(!$('compose-modal').hidden){if(e.key==='Escape'){e.preventDefault();closeCompose()}else if(e.key==='Tab'){const f=[...$('compose-modal').querySelectorAll('button,input,textarea,select')],i=f.indexOf(document.activeElement);e.preventDefault();f[(i+(e.shiftKey?-1:1)+f.length)%f.length]?.focus()}return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('command-modal').hidden?openPalette():closePalette();return}if(e.key==='Escape'){if(!$('command-modal').hidden)closePalette();else if(!$('snooze-menu').hidden){closeSnooze();$('snooze').focus()}else $('shell').classList.remove('reading');return}
if(!$('command-modal').hidden){const focusables=[$('command-input'),$('close-palette'),...$('palette-results').querySelectorAll('button')];if(e.key==='Tab'){e.preventDefault();const i=focusables.indexOf(document.activeElement);focusables[(i+(e.shiftKey?-1:1)+focusables.length)%focusables.length]?.focus()}else if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();const buttons=[...$('palette-results').querySelectorAll('button')],i=buttons.indexOf(document.activeElement);buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus()}else if(e.key==='Enter'&&document.activeElement===$('command-input')){$('palette-results').querySelector('button')?.click()}return}
if(!['INPUT','TEXTAREA'].includes(document.activeElement.tagName) && document.activeElement.getAttribute('contenteditable')!=='true'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){const action={j:()=>navigate(1),k:()=>navigate(-1),e:()=>changeFolder('archive'),h:openSnooze,p:togglePin,r:openReply,c:()=>$('compose').click()}[e.key.toLowerCase()];if(action){e.preventDefault();action()}}});
renderList();renderReader();
</script>
</body></html>
