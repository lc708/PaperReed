<svg xmlns="http://www.w3.org/2000/svg" width="840" height="172" viewBox="0 0 840 172"><rect width="840" height="172" rx="8" fill="#f7f8fa"/><path d="M410 49V152" stroke="#e0e3e8"/><text x="25" y="29" fill="#252930" font-size="15" font-family="-apple-system,PingFang SC,Arial,sans-serif">03  高亮不等于选中</text><text x="25" y="60" fill="#727985" font-size="11" font-family="-apple-system,PingFang SC,Arial,sans-serif">修改前 · 源码结构示意</text><text x="435" y="60" fill="#727985" font-size="11" font-family="-apple-system,PingFang SC,Arial,sans-serif">修改后 · 原型结构</text><text x="25" y="89" fill="#252930" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">单行高亮 → 打开邮件</text><text x="25" y="114" fill="#252930" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">Agent 入口 → 当前列表</text><text x="25" y="139" fill="#727985" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">没有勾选范围</text><text x="435" y="89" fill="#252930" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">键盘焦点与复选框分开</text><text x="435" y="114" fill="#252930" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">多选 → 批量操作 → 选中邮件</text><text x="435" y="139" fill="#727985" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">Agent 显示明确数量与授权范围</text></svg>