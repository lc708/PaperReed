function renderInbox(){const folder=S.page,items=rowsFor(folder);if(!items.some(m=>m.id===S.selected))S.selected=items[0]?.id??null;const unread=mail.filter(m=>m.folder==='inbox'&&m.unread&&(S.account==='all'||m.account===S.account)).length;let content='';if(folder==='inbox'){const pins=items.filter(m=>m.pinned),rest=items.filter(m=>!m.pinned);if(pins.length)content+=`<div class="group-title">${icon('pin')}置顶</div><div class="mail-list">${pins.map(m=>row(m)).join('')}</div>`;if(rest.length)content+=`<div class="group-title">最近来信</div><div class="mail-list">${rest.map(m=>row(m)).join('')}</div>`;}else content=`<div class="mail-list" style="padding-top:16px">${items.map(m=>row(m)).join('')}</div>`;
if(!items.length)content=empty(S.unreadOnly?'没有未读邮件':folder==='drafts'?'还没有草稿':'这里暂时没有邮件',S.unreadOnly?'已读邮件仍保留在收件箱中。':'邮件会在需要的时候出现在这里。',S.unreadOnly?'<button class="line-button" data-act="clear-unread">显示全部邮件</button>':'');
if(folder==='inbox'&&!S.unreadOnly){const bundles=mail.filter(m=>m.folder==='bundle'&&(S.account==='all'||m.account===S.account));if(bundles.length)content+=`<div class="bundle"><button class="bundle-toggle" data-act="bundle" aria-expanded="${S.bundle}"><strong>订阅来信</strong><span class="sources">Modern House · Dense Discovery</span><span class="push">${bundles.length} 封　${S.bundle?'−':'+'}</span></button>${S.bundle?`<div class="bundle-children mail-list">${bundles.map(m=>row(m)).join('')}</div>`:''}</div>`}
return header(pageNames[folder],`${S.account==='all'?'工作与个人':acctNames[S.account]}${folder==='inbox'?` · ${unread} 封未读`:''}`,agentEntry()+'<button class="primary" data-act="compose-new">写邮件</button>')+`<nav class="view-tabs" aria-label="邮件视图">${[['inbox','全部'],['pinned','置顶'],['snooze','稍后']].map(([p,t])=>`<button data-act="goto" data-id="${p}" aria-current="${folder===p?'page':'false'}">${t}</button>`).join('')}<label class="check-filter"><input type="checkbox" id="unread-filter" ${S.unreadOnly?'checked':''}>仅未读</label><button class="search-open" data-act="search-open">${icon('search')}<span>搜索</span><kbd>⌘ K</kbd></button></nav>`+content}
function renderThread(){const m=current();if(!m)return toolbar()+empty('选一封信开始阅读','返回收件箱继续查看。');const fromPage=pageNames[S.returnPage]||'收件箱';const isSnoozed=m.folder==='snooze';return toolbar(fromPage,`${isSnoozed?'<button data-act="restore-current">移回收件箱</button>':'<button data-act="archive">归档</button><button data-act="snooze-menu" aria-expanded="false">稍后</button>'}${agentEntry()}<button data-act="thread-menu" aria-label="更多邮件操作" aria-expanded="false">${icon('more')}</button>`)+`<article class="letter"><h1>${esc(m.subject)}</h1><div class="thread-meta"><span>${m.history?'2 封往来':'1 封邮件'}</span><span>·</span>${accountMark(m.account)}<span class="account-label">${esc(acctNames[m.account])}</span>${m.pinned?'<span>· 已置顶</span>':''}${isSnoozed?'<span>· '+esc(m.snoozed)+' 提醒</span>':''}</div>${m.history?`<details class="history"><summary><span>›</span><strong>我</strong><span class="excerpt">${esc(m.history)}</span><time>昨天 16:20</time></summary><p>${esc(m.history)}<br>我会在这两天把校样看完，谢谢。<br>Alex</p></details>`:''}<div class="sender-details"><div><button data-act="envelope" aria-expanded="false">${esc(m.sender)}　<span class="quiet">⌄</span></button><div class="sender-address">${esc(m.address)}</div></div><time>${m.time==='昨天'?'昨天':m.time} </time></div><div class="envelope" id="envelope" hidden>发给 ${esc(emailOf(m))}<br>日期 ${esc(m.date||'2026-11-14 '+m.time)}<br>来自 ${esc(acctNames[m.account])}</div><div class="body-copy">${m.body.map(p=>'<p>'+esc(p)+'</p>').join('')}</div><p class="signature">${esc(m.signature)}${m.studio?'<small>'+esc(m.studio)+'</small>':''}</p>${m.attachment?`<div class="attachments"><button class="file-item" data-act="attachment">${icon('file')}<span><strong>${esc(m.attachment)}</strong><small>PDF 文档 · ${m.size}</small></span></button></div>`:''}<div class="reply-box"><button class="reply-trigger" id="reply-trigger" data-act="reply"><span>${m.folder==='draft'?'继续编辑草稿':'回复 '+esc(m.sender)}</span>${icon('arrow')}</button><div class="reply-editor" id="reply-editor" hidden><div class="reply-from">${esc(acctNames[m.account])} → ${esc(m.address)}</div><textarea id="reply-text" aria-label="回复正文" placeholder="写下你的回复…">${esc(S.replyDrafts[m.id]||'')}</textarea><div class="editor-footer"><span id="reply-status">草稿保留在此原型中</span>${agentEntry()}<button class="text-button" data-act="reply-collapse">收起</button><button class="primary" data-act="reply-send">发送</button></div></div></div></article>`}
function renderCompose(){const c=S.composer;return toolbar('新邮件',`<span class="saved-status" id="compose-status">草稿已保存</span><button data-act="compose-more" aria-label="草稿操作">${icon('more')}</button>`)+`<div class="compose-wrap"><input class="compose-subject" id="compose-subject" aria-label="邮件主题" placeholder="主题" value="${esc(c.subject)}"><div class="field"><label for="compose-from">发件人</label><select id="compose-from"><option value="work" ${c.from==='work'?'selected':''}>Alex · ${acctEmails.work}</option><option value="personal" ${c.from==='personal'?'selected':''}>Alex · ${acctEmails.personal}</option></select></div><div class="field"><label for="compose-to">收件人</label><input id="compose-to" type="email" value="${esc(c.to)}" placeholder="name@example.com"><button class="text-button" data-act="toggle-cc">抄送</button></div><div class="field" id="cc-field" ${c.ccOpen?'':'hidden'}><label for="compose-cc">抄送</label><input id="compose-cc" type="email" value="${esc(c.cc)}" placeholder="name@example.com"></div><textarea class="compose-body" id="compose-body" aria-label="邮件正文" placeholder="写下你的邮件…">${esc(c.body)}</textarea><div class="compose-attachments" id="compose-files">${composeFiles()}</div><div class="compose-bottom"><button class="text-button" data-act="attach-file">${icon('clip')}添加附件</button><input type="file" id="file-input" multiple hidden><span class="saved-status" id="file-status"></span>${agentEntry()}<button class="primary" data-act="compose-send">发送</button></div></div>`}
function composeFiles(){return S.composer.files.map((f,i)=>`<button class="file-item" data-act="remove-file" data-id="${i}" title="移除附件">${icon('file')}<span><strong>${esc(f.name)}</strong><small>${esc(f.size)} · 点击移除</small></span></button>`).join('')}
function searchItems(){const q=S.query.trim().toLowerCase();return mail.filter(m=>m.folder!=='draft'&&(S.searchAccount==='all'||m.account===S.searchAccount)&&(!S.hasAttachment||!!m.attachment)&&(!q||(m.subject+' '+m.snippet+' '+m.sender+' '+m.body.join(' ')).toLowerCase().includes(q)))}
function searchResults(){const items=searchItems();return `<div class="result-summary">${items.length} 封匹配邮件${S.hasAttachment?' · 含附件':''}</div>${items.length?`<div class="mail-list">${items.map(m=>row(m,{search:true})).join('')}</div>`:empty('没有找到这封信','试试更短的关键词，或移除当前筛选条件。','<button class="line-button" data-act="search-clear">清除搜索与筛选</button>')}`}
function renderSearch(){return header('搜索','搜索所有已接入邮箱中的邮件。')+`<div class="search-field">${icon('search')}<input id="search-query" aria-label="搜索邮件" placeholder="主题、发件人或正文" value="${esc(S.query)}"><button class="icon-button" data-act="query-clear" aria-label="清空关键词">${icon('close')}</button></div><div class="search-filters"><select id="search-account" aria-label="搜索邮箱范围"><option value="all">所有邮箱</option><option value="work" ${S.searchAccount==='work'?'selected':''}>工作邮箱</option><option value="personal" ${S.searchAccount==='personal'?'selected':''}>个人邮箱</option></select><label><input type="checkbox" id="search-attachment" ${S.hasAttachment?'checked':''}>含附件</label><button class="text-button push" data-act="search-clear">重置</button></div><div id="search-results">${searchResults()}</div>`}
function renderSnooze(){const items=mail.filter(m=>m.folder==='snooze'&&(S.account==='all'||m.account===S.account));const times=[...new Set(items.map(m=>m.snoozed))].sort((a,b)=>{const rank=t=>t.startsWith('今天')?0:t.startsWith('明天')?1:2;return rank(a)-rank(b)});return header('稍后处理','在合适的时候，让邮件回到收件箱。')+`<div class="snooze-intro">${icon('clock')}提醒时间使用本机时区 · 纽约</div>`+(items.length?times.map(t=>`<section class="snooze-group"><h2 class="snooze-date">${esc(t.split(' ')[0])}<small>${t.includes('今天')?'11 月 14 日':t.includes('明天')?'11 月 15 日':'11 月 16 日'} · ${esc(t.split(' ')[1])}</small></h2>${items.filter(m=>m.snoozed===t).map(m=>`<div class="snooze-row">${row(m,{snooze:true})}<button class="restore" data-act="restore" data-id="${m.id}">移回收件箱</button></div>`).join('')}</section>`).join(''):empty('暂时没有稍后邮件','需要晚点处理时，在邮件里选择“稍后”。','<button class="line-button" data-act="goto" data-id="inbox">返回收件箱</button>'))}
function settingsTabs(){return `<nav class="view-tabs settings-tabs" aria-label="设置类别"><button data-act="accounts" aria-current="${S.page==='accounts'?'page':'false'}">邮箱与偏好</button><button data-act="agents" aria-current="${S.page==='agents'?'page':'false'}">外部 Agent</button></nav>`}
function renderAccounts(){return header('设置','你的邮箱，按你的习惯工作。')+settingsTabs()+`<div class="settings-content"><section class="settings-section"><div class="section-heading"><h2>已接入的邮箱</h2><p>3 个账号</p></div>${[['work','G','Google Workspace',false],['personal','i','iCloud',false],['archive','O','Outlook',true]].map(([id,letter,provider,expired])=>`<div class="account-row"><span class="account-monogram" style="color:${accountStyle[id].color};background:color-mix(in srgb,${accountStyle[id].color} 10%,var(--card))">${letter}</span><div class="account-info"><strong>${esc(acctNames[id])}<small>${provider}</small></strong><p>${acctEmails[id]}</p></div><span class="account-state ${expired?'warning':''}">${expired?'需要重新授权':'已同步'}</span><button class="text-button" data-act="${expired?'reconnect':'manage-account'}" data-id="${id}">${expired?'重新连接':'管理'}</button></div>`).join('')}<button class="add-account" data-act="add-account"><span>＋</span>添加邮箱</button></section><section class="settings-section"><div class="section-heading"><h2>收发偏好</h2></div><div class="setting-row"><div><strong>新邮件的默认发件人</strong><p>回复时自动使用收到原邮件的账号。</p></div><select id="default-sender" aria-label="默认发件人"><option value="work" ${S.defaultSender==='work'?'selected':''}>工作邮箱</option><option value="personal" ${S.defaultSender==='personal'?'selected':''}>个人邮箱</option></select></div><div class="setting-row"><div><strong>自动加载远程图片</strong><p>关闭后，可在阅读邮件时按需加载。</p></div><button class="switch" role="switch" aria-label="自动加载远程图片" aria-checked="${S.remoteImages}" data-act="remote-images"></button></div></section></div>`}
function renderAgents(){const name=clients[S.agent];return header('设置','让你常用的 Agent 在本机处理邮件。')+settingsTabs()+`<div class="settings-content"><div class="setting-row"><div><strong>本机 CLI</strong><p>${S.cliInstalled?'已安装 · 示例状态':'尚未安装，安装后可从邮件页面直接调用 Agent。'}</p></div><button class="text-button" data-act="agent-entry">${S.cliInstalled?'使用 Agent':'安装引导'}</button></div><div class="setting-row" style="margin-top:18px"><div><strong>允许外部 Agent 访问</strong><p>通过本机客户端连接，共享同一份邮件状态。</p></div><button class="switch" role="switch" aria-label="允许外部 Agent 访问" aria-checked="${S.enabled}" data-act="agent-enable"></button></div><section class="settings-section"><div class="section-heading"><h2>连接到</h2></div><div class="agent-options">${Object.entries(clients).map(([key,label])=>`<button data-act="agent-client" data-id="${key}" aria-pressed="${S.agent===key}">${label}</button>`).join('')}</div><div class="connection-detail"><span class="agent-glyph">›_</span><div><h3>${name}</h3><p>${S.enabled?(S.agentConnected[S.agent]?'已连接 · 示例状态':'尚未配置本机连接'):'外部访问已关闭'}</p></div><button class="secondary" data-act="agent-connect" ${S.enabled?'':'disabled'}>${S.agentConnected[S.agent]?'查看连接':'配置连接'}</button></div></section><section class="settings-section"><div class="section-heading"><h2>允许的操作</h2><p>应用于外部访问</p></div>${[['read','阅读与搜索','读取邮件正文、会话与附件信息。'],['organize','整理与草拟','归档、标记、稍后处理和创建回复草稿。'],['send','发送邮件','允许 Agent 从所选账号发送邮件。']].map(([key,label,desc])=>`<label class="permission-row"><input type="checkbox" data-permission="${key}" ${S.permissions[key]?'checked':''} ${S.enabled?'':'disabled'}><span><strong>${label}</strong><small>${desc}</small></span></label>`).join('')}</section><section class="settings-section"><div class="section-heading"><h2>可访问的邮箱</h2></div><div class="agent-scopes">${['work','personal'].map(a=>`<label><input type="checkbox" data-agent-account="${a}" ${S.agentAccounts[a]?'checked':''} ${S.enabled?'':'disabled'}>${esc(acctNames[a])}</label>`).join('')}</div></section></div>`}
function render(){const renderers={inbox:renderInbox,pinned:renderInbox,drafts:renderInbox,archive:renderInbox,thread:renderThread,compose:renderCompose,search:renderSearch,snooze:renderSnooze,accounts:renderAccounts,agents:renderAgents};$('screen').innerHTML=(renderers[S.page]||renderInbox)();$('screen').setAttribute('aria-label',pageNames[S.page]);$('screen').dataset.page=S.page;$('scope').innerHTML=(S.account==='all'?'所有邮箱':acctNames[S.account])+' <span class="chevron"></span>';document.querySelectorAll('[data-preview]').forEach(b=>b.setAttribute('aria-current',b.dataset.preview===(['pinned','drafts','archive'].includes(S.page)?'inbox':S.page)?'page':'false'));bindFields()}
function go(page){closeMenu();if(!$('overlay').hidden)closeModal();S.page=page;render();$('screen').scrollTop=0}
function openThread(id){if(S.page!=='thread'){S.returnPage=S.page;listScroll=$('screen').scrollTop}S.selected=Number(id);const m=current();if(!m)return;m.unread=false;go('thread')}
function back(){const target=S.returnPage==='thread'?'inbox':S.returnPage;go(target||'inbox');$('screen').scrollTop=listScroll}
function reply(){const m=current();if(!m)return;if(m.folder==='draft'){loadComposer(m);return}if(S.page!=='thread')openThread(m.id);$('reply-trigger').hidden=true;$('reply-editor').hidden=false;$('reply-text').focus();$('reply-editor').scrollIntoView({block:'nearest'})}
function changeFolder(folder,snoozed){const m=current();if(!m)return;const old={folder:m.folder,snoozed:m.snoozed},oldId=m.id,oldPage=S.page;const origin=['inbox','pinned','drafts','archive'].includes(S.returnPage)?S.returnPage:'inbox';const before=rowsFor(origin),index=before.indexOf(m);m.folder=folder;m.snoozed=snoozed;closeMenu();if(oldPage==='thread'){const remaining=rowsFor(origin);S.selected=remaining[Math.max(0,Math.min(index,remaining.length-1))]?.id??null;if(!S.selected)go(origin);else render()}else render();notice(folder==='archive'?'邮件已归档':`将在${snoozed}回到收件箱`,()=>{Object.assign(m,old);S.selected=oldId;go(oldPage)})}
function restore(id){const m=getMail(id);if(!m)return;const old=m.snoozed;m.folder='inbox';delete m.snoozed;render();notice('已移回收件箱',()=>{m.folder='snooze';m.snoozed=old;render()})}
function togglePin(){const m=current();if(!m)return;m.pinned=!m.pinned;closeMenu();render();notice(m.pinned?'已置顶':'已取消置顶')}
function openSnooze(anchor){closeMenu();popover(anchor,`<div class="menu-label">稍后回到收件箱</div>${menuButton('今天晚些时候','snooze-set','18:00','今天 18:00')}${menuButton('明天上午','snooze-set','09:00','明天 09:00')}${menuButton('下周一','snooze-set','09:00','下周一 09:00')}`)}
function saveComposer(){const c=S.composer;let m=c.id?getMail(c.id):null;if(!m){c.id=Math.max(...mail.map(m=>m.id))+1;m={id:c.id};mail.push(m)}Object.assign(m,{sender:'我',address:acctEmails[c.from],account:c.from,to:c.to,subject:c.subject||'（无主题）',snippet:c.body.split('\n').find(Boolean)||'继续完成这封邮件',body:c.body.split('\n').filter(Boolean),signature:'Alex',time:'刚刚',folder:'draft',unread:false});const status=$('compose-status');if(status)status.textContent='草稿已保存'}
function loadComposer(m){S.returnPage=S.page;S.composer={id:m.id,from:m.account,to:m.to||'',cc:'',subject:m.subject,body:m.body.join('\n\n'),files:[],ccOpen:false};go('compose')}
function newComposer(){S.returnPage=S.page;S.composer={id:null,from:S.defaultSender,to:'',cc:'',subject:'',body:'',files:[],ccOpen:false};go('compose');$('compose-to').focus()}
function sendComposer(){const c=S.composer;if(!c.to||!$('compose-to').checkValidity()){notice('请填写有效的收件人邮箱');$('compose-to').focus();return}if(c.cc&&!$('compose-cc').checkValidity()){notice('请检查抄送邮箱');return}if(!c.subject.trim()){notice('请填写邮件主题');$('compose-subject').focus();return}if(!c.body.trim()){notice('请先写下邮件正文');$('compose-body').focus();return}saveComposer();notice('发送流程演示完成；原型没有发送真实邮件。')}
function bindFields(){const bind=(id,event,fn)=>{if($(id))$(id).addEventListener(event,fn)};
bind('unread-filter','change',e=>{S.unreadOnly=e.target.checked;render()});
bind('search-query','input',e=>{S.query=e.target.value;$('search-results').innerHTML=searchResults()});
bind('search-account','change',e=>{S.searchAccount=e.target.value;$('search-results').innerHTML=searchResults()});
bind('search-attachment','change',e=>{S.hasAttachment=e.target.checked;$('search-results').innerHTML=searchResults()});
bind('reply-text','input',e=>{S.replyDrafts[S.selected]=e.target.value;$('reply-status').textContent='草稿已保存'});
[['compose-from','from'],['compose-to','to'],['compose-cc','cc'],['compose-subject','subject'],['compose-body','body']].forEach(([id,key])=>bind(id,id==='compose-from'?'change':'input',e=>{S.composer[key]=e.target.value;saveComposer()}));
bind('file-input','change',e=>{for(const file of e.target.files)S.composer.files.push({name:file.name,size:file.size>1024*1024?(file.size/1024/1024).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1024))+' KB'});$('compose-files').innerHTML=composeFiles();saveComposer();$('file-status').textContent='附件仅在本机原型中展示';e.target.value=''});
bind('default-sender','change',e=>S.defaultSender=e.target.value);
document.querySelectorAll('[data-permission]').forEach(input=>input.onchange=()=>S.permissions[input.dataset.permission]=input.checked);
document.querySelectorAll('[data-agent-account]').forEach(input=>input.onchange=()=>S.agentAccounts[input.dataset.agentAccount]=input.checked);
}
function accountModal(id){showModal(modalHead(acctNames[id])+`<p>${acctEmails[id]}</p><div class="setting-row"><div><strong>账号名称</strong><p>用于统一收件箱中的账号标识。</p></div><input id="account-name" aria-label="账号名称" style="width:120px;border:1px solid var(--border);border-radius:4px;padding:7px" value="${esc(acctNames[id])}"></div><div class="setting-row"><div><strong>账号颜色</strong><p>用于列表标记，不染色整行。</p></div><input type="color" id="account-color" aria-label="账号颜色" value="${accountStyle[id].color}"></div><div class="setting-row"><div><strong>标记形状</strong><p>不用只依赖颜色区分账号。</p></div><select id="account-shape" aria-label="账号标记形状">${[['square','方形'],['circle','圆形'],['diamond','菱形']].map(([v,t])=>`<option value="${v}" ${accountStyle[id].shape===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="actions"><button class="secondary" data-act="modal-close">取消</button><button class="primary" data-act="save-account-name" data-id="${id}">保存</button></div>`)}
function addAccount(){showModal(modalHead('添加邮箱')+'<p>选择邮箱服务。正式客户端将在服务商页面完成授权。</p>'+[['Google','Gmail / Workspace'],['Microsoft','Outlook / Microsoft 365'],['iCloud','Apple 邮箱'],['其他邮箱','IMAP / SMTP']].map(([p,desc])=>`<button class="provider-option" data-act="provider" data-id="${p}">${p}<small>${desc}　›</small></button>`).join(''))}
function connectAgent(){const name=clients[S.agent];const scopes=Object.entries(S.permissions).filter(([,v])=>v).map(([k])=>({read:'阅读与搜索',organize:'整理与草拟',send:'发送邮件'})[k]);const accounts=Object.entries(S.agentAccounts).filter(([,v])=>v).map(([k])=>acctNames[k]);if(!scopes.length||!accounts.length){notice('请选择至少一种操作和一个邮箱');return}showModal(modalHead(`连接 ${name}`)+`<p>连接后，${name} 将通过本机客户端处理所选邮箱。客户端需要保持运行。</p><div class="setting-row"><strong>可访问邮箱</strong><span class="quiet small">${accounts.join('、')}</span></div><div class="setting-row"><strong>允许的操作</strong><span class="quiet small">${scopes.join('、')}</span></div><p style="margin-top:20px;font-size:11px">这是接入流程预览，不会写入 Agent 配置或连接真实邮箱。</p><div class="actions"><button class="secondary" data-act="modal-close">取消</button><button class="primary" data-act="agent-simulate">模拟连接</button></div>`)}
function commandList(q=''){const list=[['打开搜索','command-search','⌘ K'],['归档当前邮件','archive','E'],['稍后处理','command-snooze','H'],['置顶 / 取消置顶','pin','P'],['回复当前邮件','reply','R'],['写邮件','compose-new','C'],['邮箱设置','accounts',''],['外部 Agent','agents','']].filter(([label])=>label.includes(q));return list.map(([label,action,key])=>menuButton(label,action,key)).join('')||'<p class="small quiet" style="padding:15px 7px">没有匹配的命令</p>'}
function openCommands(){showModal('<input class="command-input" id="command-query" placeholder="输入命令…" aria-label="搜索命令"><div class="command-results" id="command-results">'+commandList()+'</div>');$('command-query').oninput=e=>$('command-results').innerHTML=commandList(e.target.value)}
function preview(page){if(page==='thread'){S.selected=2;S.returnPage='inbox'}if(page==='compose'&&!S.composer.subject)S.composer={...composerSeed,files:[]};if(page==='search'&&!S.query)S.query='校样';go(page)}

function agentContext(){
 if(S.page==='compose')return {type:'draft',label:'当前草稿',detail:S.composer.subject||'（无主题）',count:1,accounts:[S.composer.from]};
 if(S.page==='thread')return {type:'thread',label:$('reply-editor')&&!$('reply-editor').hidden?'当前会话与回复草稿':'当前会话',detail:current()?.subject||'',count:1,accounts:[current()?.account]};
 const items=S.page==='search'?searchItems():rowsFor(['inbox','pinned','drafts','archive'].includes(S.page)?S.page:'inbox');
 return {type:'list',label:'当前列表',detail:(S.account==='all'?'所有邮箱':acctNames[S.account])+' · '+items.length+' 封邮件',count:items.length,accounts:items.map(m=>m.account)};
}
function launchAgent(){const context=agentContext();
 if(!S.cliInstalled){showModal(modalHead('让 Agent 接手邮件')+`<p>先安装随客户端提供的 CLI，再连接你常用的 Agent。安装后，这个入口会直接携带当前邮件或草稿的上下文。</p><div class="handoff-context"><span>${esc(context.label)}</span><strong>${esc(context.detail)}</strong></div><ol class="install-steps"><li><strong>安装本机 CLI</strong><span>由桌面客户端提供，具体安装方式待实现确认。</span></li><li><strong>配置 Agent</strong><span>选择客户端与允许访问的邮箱。</span></li><li><strong>从这里继续处理</strong><span>带入选定内容，无需手动查找邮件。</span></li></ol><div class="actions"><button class="secondary" data-act="modal-close">稍后</button><button class="primary" data-act="cli-preview">预览安装完成态</button></div>`);return}
 const eligible=context.accounts.filter(a=>S.agentAccounts[a]).length;const ready=S.enabled&&S.agentConnected[S.agent]&&eligible>0&&S.permissions.read;const task=context.type==='draft'?'润色这封草稿，保留我的语气，不发送。':context.type==='thread'?'总结这段会话，并起草一封回复，不发送。':'整理当前列表，指出需要我回复的邮件，先给出建议。';
 showModal(modalHead('交给 Agent')+`<div class="handoff-context"><span>${esc(context.label)}</span><strong>${esc(context.detail)}</strong></div><label class="handoff-label" for="handoff-task">想让 Agent 做什么</label><textarea id="handoff-task" class="handoff-task">${task}</textarea><div class="setting-row"><div><strong>${clients[S.agent]}</strong><p>${!S.enabled?'外部 Agent 访问已关闭':!eligible?'当前范围内没有已授权邮箱':!S.permissions.read?'需要允许阅读与搜索':S.agentConnected[S.agent]?'连接已配置（示例）':'需要配置本机连接'}</p></div><button class="text-button" data-act="handoff-config">${ready?'更换 / 设置':'配置连接'}</button></div><p class="small" style="margin:16px 0 0">${context.type==='list'?`仅带入其中 ${eligible} 封已授权邮件。`:eligible?'此邮箱已在授权范围内。':'此邮箱不在授权范围内。'} 写回草稿或整理邮件需另有对应权限；不会自动发送。</p><div class="actions"><button class="secondary" data-act="modal-close">取消</button><button class="primary" data-act="handoff-preview" ${ready?'':'disabled'}>交给 ${clients[S.agent]}</button></div>`)
}

function act(action,id,button){switch(action){
case 'agent-entry':launchAgent();break;
case 'cli-preview':S.cliInstalled=true;closeModal();render();launchAgent();break;
case 'handoff-config':S.handoffOrigin={page:S.page,selected:S.selected};closeModal();go('agents');break;
case 'handoff-preview':if(!$('handoff-task').value.trim()){notice('请填写要处理的任务');break}closeModal();notice('交接预览已完成；未实际启动 Agent 或发送邮件。');break;
case 'goto':S.unreadOnly=false;go(id);break;
case 'accounts':case 'agents':go(action);break;
case 'scope':popover(button,menuButton('所有邮箱','scope-set','','all')+menuButton('工作邮箱','scope-set','','work')+menuButton('个人邮箱','scope-set','','personal')+menuButton('备用邮箱','scope-set','','archive')+'<hr>'+menuButton('草稿','goto','','drafts')+menuButton('归档','goto','','archive')+'<hr>'+menuButton('邮箱设置','accounts')+menuButton('外部 Agent','agents'));break;
case 'scope-set':S.account=id;S.unreadOnly=false;go('inbox');break;
case 'open':openThread(id);break;
case 'back':back();break;
case 'bundle':S.bundle=!S.bundle;render();break;
case 'clear-unread':S.unreadOnly=false;render();break;
case 'archive':if(!$('overlay').hidden)closeModal();changeFolder('archive');break;
case 'pin':if(!$('overlay').hidden)closeModal();togglePin();break;
case 'snooze-menu':openSnooze(button);break;
case 'command-snooze':closeModal();openSnooze($('scope'));break;
case 'snooze-set':changeFolder('snooze',id);break;
case 'restore':restore(id);break;
case 'restore-current':restore(S.selected);break;
case 'thread-menu':popover(button,menuButton(current()?.pinned?'取消置顶':'置顶','pin','P')+menuButton('标记为未读','mark-unread','U')+menuButton('搜索此发件人','sender-search'));break;
case 'mark-unread':if(current())current().unread=true;go(S.returnPage);notice('已标记为未读');break;
case 'sender-search':S.query=current()?.sender||'';go('search');break;
case 'envelope':$('envelope').hidden=!$('envelope').hidden;button.setAttribute('aria-expanded',String(!$('envelope').hidden));break;
case 'reply':if(!$('overlay').hidden)closeModal();reply();break;
case 'reply-collapse':$('reply-editor').hidden=true;$('reply-trigger').hidden=false;break;
case 'reply-send':if(!$('reply-text').value.trim()){notice('请先写下回复');$('reply-text').focus()}else notice('发送流程演示完成；原型没有发送真实邮件。');break;
case 'attachment':notice('附件预览示例：'+current().attachment);break;
case 'compose-new':if(!$('overlay').hidden)closeModal();newComposer();break;
case 'compose-more':popover(button,menuButton('保存并返回','compose-return')+menuButton('丢弃这份草稿','compose-discard'));break;
case 'compose-return':saveComposer();back();break;
case 'compose-discard':if(S.composer.id){const i=mail.findIndex(m=>m.id===S.composer.id);if(i>=0)mail.splice(i,1)}S.composer={...composerSeed,id:null,subject:'',body:'',to:'',files:[]};go('inbox');notice('示例草稿已丢弃');break;
case 'compose-send':sendComposer();break;
case 'toggle-cc':S.composer.ccOpen=!S.composer.ccOpen;$('cc-field').hidden=!S.composer.ccOpen;if(S.composer.ccOpen)$('compose-cc').focus();break;
case 'attach-file':$('file-input').click();break;
case 'remove-file':S.composer.files.splice(Number(id),1);$('compose-files').innerHTML=composeFiles();break;
case 'search-open':S.returnPage=S.page;S.query='';go('search');$('search-query').focus();break;
case 'command-search':closeModal();S.returnPage=S.page;go('search');$('search-query').focus();break;
case 'query-clear':S.query='';$('search-query').value='';$('search-results').innerHTML=searchResults();$('search-query').focus();break;
case 'search-clear':S.query='';S.searchAccount='all';S.hasAttachment=false;render();$('search-query').focus();break;
case 'manage-account':accountModal(id);break;
case 'save-account-name':accountStyle[id].color=$('account-color').value;accountStyle[id].shape=$('account-shape').value;if($('account-name').value.trim())acctNames[id]=$('account-name').value.trim();closeModal();render();break;
case 'add-account':addAccount();break;
case 'provider':showModal(modalHead(`接入 ${esc(id)}`)+`<p>下一步将进入 ${esc(id)} 的授权流程。授权成功后，账号会出现在统一收件箱中。</p><p class="small">本原型不发起登录，也不接收任何邮箱凭据。</p><div class="actions"><button class="primary" data-act="modal-close">完成预览</button></div>`);break;
case 'reconnect':showModal(modalHead('重新连接邮箱')+`<p>${acctEmails[id]} 的授权已过期。已缓存的邮件仍可阅读，收发将在重新授权后继续。</p><div class="actions"><button class="secondary" data-act="modal-close">稍后</button><button class="primary" data-act="provider" data-id="Microsoft">查看授权流程</button></div>`);break;
case 'remote-images':S.remoteImages=!S.remoteImages;button.setAttribute('aria-checked',String(S.remoteImages));break;
case 'agent-enable':S.enabled=!S.enabled;render();break;
case 'agent-client':S.agent=id;render();break;
case 'agent-connect':connectAgent();break;
case 'agent-simulate':S.agentConnected[S.agent]=true;closeModal();if(S.handoffOrigin){const origin=S.handoffOrigin;S.handoffOrigin=null;S.selected=origin.selected;go(origin.page);launchAgent()}else render();notice('连接状态已模拟；没有修改本机 Agent 配置。');break;
case 'modal-close':closeModal();break;
case 'undo':const undo=S.undo;S.undo=null;$('toast').hidden=true;undo?.();break;
}}
document.addEventListener('click',e=>{const previewButton=e.target.closest('[data-preview]');if(previewButton){preview(previewButton.dataset.preview);return}const button=e.target.closest('button[data-act]');if(button){e.stopPropagation();act(button.dataset.act,button.dataset.id,button);return}if(e.target===$('overlay'))closeModal();if(!$('popover').contains(e.target)&&!S.menuAnchor?.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.isComposing)return;const modalOpen=!$('overlay').hidden;if(modalOpen){if(e.key==='Escape'){e.preventDefault();closeModal()}else if(e.key==='Tab'){const els=[...$('modal').querySelectorAll('button,input,select,textarea')].filter(el=>!el.disabled),i=els.indexOf(document.activeElement);e.preventDefault();els[(i+(e.shiftKey?-1:1)+els.length)%els.length]?.focus()}else if(['ArrowDown','ArrowUp'].includes(e.key)&&$('command-results')){e.preventDefault();const els=[...$('command-results').querySelectorAll('button')],i=els.indexOf(document.activeElement);els[(i+(e.key==='ArrowDown'?1:-1)+els.length)%els.length]?.focus()}return}
if(e.key==='Escape'){if(!$('popover').hidden)closeMenu(true);else if(S.page==='thread'||S.page==='compose')back();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCommands();return}if(!$('popover').hidden&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const els=[...$('popover').querySelectorAll('button')],i=els.indexOf(document.activeElement);els[(i+(e.key==='ArrowDown'?1:-1)+els.length)%els.length]?.focus();return}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;
const key=e.key.toLowerCase();const listPages=['inbox','pinned','archive','drafts'];if(['j','k'].includes(key)&&(listPages.includes(S.page)||S.page==='thread')){const page=S.page==='thread'?(listPages.includes(S.returnPage)?S.returnPage:'inbox'):S.page;const list=rowsFor(page),i=list.findIndex(m=>m.id===S.selected),next=list[i+(key==='j'?1:-1)];if(next){S.selected=next.id;if(S.page==='thread')openThread(next.id);else{render();$('screen').querySelector(`[data-id="${next.id}"]`)?.scrollIntoView({block:'nearest'})}}e.preventDefault();return}if(key==='enter'&&listPages.includes(S.page)&&document.activeElement===document.body){openThread(S.selected);return}const actions={e:'archive',p:'pin',r:'reply',c:'compose-new'};if(actions[key]&&(listPages.includes(S.page)||S.page==='thread')){e.preventDefault();act(actions[key],null,$('scope'))}else if(key==='h'&&(listPages.includes(S.page)||S.page==='thread')){e.preventDefault();openSnooze($('scope'))}});
saveComposer();S.page=document.body.dataset.initial||'inbox';render();
</script>
</body></html>
