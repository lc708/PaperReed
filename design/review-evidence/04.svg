<svg xmlns="http://www.w3.org/2000/svg" width="840" height="172" viewBox="0 0 840 172"><rect width="840" height="172" rx="8" fill="#f7f8fa"/><path d="M410 49V152" stroke="#e0e3e8"/><text x="25" y="29" fill="#252930" font-size="15" font-family="-apple-system,PingFang SC,Arial,sans-serif">04  恢复和搜索范围不明确</text><text x="25" y="60" fill="#727985" font-size="11" font-family="-apple-system,PingFang SC,Arial,sans-serif">修改前 · 源码结构示意</text><text x="435" y="60" fill="#727985" font-size="11" font-family="-apple-system,PingFang SC,Arial,sans-serif">修改后 · 原型结构</text><text x="25" y="89" fill="#252930" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">恢复函数只还原到“稍后”</text><text x="25" y="114" fill="#252930" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">搜索排除草稿，未定义垃圾邮件范围</text><text x="25" y="139" fill="#727985" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">第六版未提供垃圾邮件 / 废纸篓页面</text><text x="435" y="89" fill="#252930" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">按原位置恢复 / 撤销</text><text x="435" y="114" fill="#252930" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">垃圾邮件与废纸篓默认不参与搜索</text><text x="435" y="139" fill="#727985" font-size="12" font-family="-apple-system,PingFang SC,Arial,sans-serif">用户主动勾选后再纳入</text></svg>