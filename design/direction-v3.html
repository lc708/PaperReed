<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>来信 · 界面方向 03</title>
<style>
:root{--background:#f8f7f3;--card:#fcfbf8;--foreground:#35372f;--muted:#f1f0ea;--muted-foreground:#77796f;--border:#e6e5dd;--primary:#657157;--primary-foreground:#fcfbf8;--accent:#eaece3;--ring:#7c8a6d;--popover:#fcfbf8;--secondary:#eeeee7;--radius:12px;--font-sans:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;--font-mono:ui-monospace,monospace;--serif:"Songti SC","STSong","Noto Serif CJK SC",Georgia,serif;--destructive:#da776f;--warning:#d9b264;--success:#859b79}
*{box-sizing:border-box}body{margin:0;font:13px/1.5 var(--font-sans);color:var(--foreground)}button,input,textarea,select{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:hover{color:var(--primary)}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--ring);outline-offset:5px}button:disabled{opacity:.4;cursor:default}button:active{opacity:.65}[hidden]{display:none!important}h1,h2,p{margin:0}kbd{font:10px var(--font-sans);color:var(--muted-foreground)}
.window{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;overflow:hidden;box-shadow:0 12px 40px color-mix(in srgb,var(--foreground) 5%,transparent)}.workspace{display:grid;grid-template-columns:268px minmax(0,1fr);height:738px;margin:-16px}.correspondence{background:var(--muted);display:flex;flex-direction:column;min-height:0;min-width:0}.window-controls{display:flex;align-items:center;gap:7px;height:58px;padding:0 25px;flex:none}.window-controls i{width:10px;height:10px;border-radius:50%;background:var(--destructive)}.window-controls i:nth-child(2){background:var(--warning)}.window-controls i:nth-child(3){background:var(--success)}.mailbox-switch{display:flex;align-items:center;gap:7px;padding:0;font-size:11px;color:var(--muted-foreground);text-align:left}.small-chevron{width:5px;height:5px;border-bottom:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg);margin-top:-3px}.list-heading{padding:22px 30px 25px}.list-title{display:flex;align-items:center;justify-content:space-between;margin-top:13px}.list-title h1{font:30px/1.3 var(--serif);font-weight:500;letter-spacing:.02em}.write-button{font-size:11px;padding:5px 0;color:var(--muted-foreground)}.threads{overflow:auto;min-height:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent;padding:0 18px;flex:1}.thread{width:100%;position:relative;display:block;text-align:left;padding:18px 12px 19px;border-radius:2px;margin-bottom:3px;transition:background 120ms}.thread:hover{background:color-mix(in srgb,var(--card) 45%,transparent)}.thread.selected{background:color-mix(in srgb,var(--card) 67%,transparent)}.thread.selected:before{content:"";position:absolute;width:2px;top:20px;bottom:22px;left:0;background:var(--primary)}.thread .sender{display:block;font-size:12px;font-weight:500;letter-spacing:.02em}.thread.unread .sender{font-weight:650}.thread .subject{display:block;font-size:12px;color:var(--muted-foreground);margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.01em}.thread.selected .subject{color:var(--foreground)}.thread .when{float:right;font-size:10px;font-weight:400;color:var(--muted-foreground);opacity:0;transition:opacity 100ms}.thread:hover .when,.thread:focus-visible .when{opacity:1}.small-note{font-size:10px;color:var(--muted-foreground);margin:30px 12px 9px;letter-spacing:.05em}.subscriptions{border-top:1px solid var(--border);margin:31px 12px 0;padding-top:20px}.subscriptions>button{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:11px;padding:0;color:var(--muted-foreground);text-align:left}.subscriptions .thread{padding-left:0;padding-right:0}.subscriptions .thread.selected:before{left:-12px}.list-footer{padding:22px 30px 26px;flex:none}.search-button{width:100%;padding:0;display:flex;align-items:center;justify-content:space-between;text-align:left;font-size:11px;color:var(--muted-foreground)}
.reader{min-width:0;min-height:0;display:flex;flex-direction:column;position:relative}.reading-tools{display:flex;align-items:center;gap:21px;justify-content:flex-end;height:58px;min-height:58px;padding:0 36px;color:var(--muted-foreground)}.reading-tools button{font-size:11px;padding:5px 0}.reading-tools .more{font-family:Georgia,serif;font-size:20px;letter-spacing:2px;line-height:1}.reading-tools .back{margin-right:auto;display:none}.read-scroll{flex:1;min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent}.letter{width:100%;max-width:720px;padding:39px 62px 48px;margin:0 auto}.correspondent{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:29px;font-size:12px}.sender-info{padding:0;text-align:left;letter-spacing:.02em}.correspondent time{color:var(--muted-foreground);font-size:10px;white-space:nowrap;letter-spacing:.04em}.envelope{font-size:11px;color:var(--muted-foreground);padding:0 0 22px;margin-top:-14px;line-height:1.9;overflow-wrap:anywhere}.subject-title{font:500 29px/1.6 var(--serif);letter-spacing:.04em;max-width:520px;margin-bottom:30px;text-wrap:pretty;overflow-wrap:anywhere}.letter-body{font-size:14px;font-weight:400;line-height:2.05;letter-spacing:.02em}.letter-body p+p{margin-top:18px}.signature{margin-top:25px;font-size:13px}.signature small{display:block;font-size:9px;letter-spacing:.13em;margin-top:6px;color:var(--muted-foreground)}.attachment{display:flex;gap:9px;align-items:center;text-align:left;font-size:11px;color:var(--muted-foreground);margin-top:30px;padding:0 0 3px;border-bottom:1px solid var(--border);max-width:100%}.attachment .filename{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.attachment small{font-size:10px;white-space:nowrap}.reply{margin-top:37px;border-top:1px solid var(--border);padding-top:21px}.reply-open{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:0;color:var(--muted-foreground);font-size:12px}.reply-open span:last-child{font-family:Georgia,serif;font-size:17px;color:var(--primary)}.reply-label{font-size:11px;color:var(--muted-foreground);margin-bottom:14px}.reply textarea{width:100%;min-height:105px;border:0;background:transparent;resize:vertical;font-size:14px;line-height:1.9;padding:0}.reply-actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:10px;color:var(--muted-foreground)}.text-action{padding:0 0 3px;color:var(--primary);border-bottom:1px solid color-mix(in srgb,var(--primary) 40%,transparent);font-size:11px}.empty{padding:50px 12px;color:var(--muted-foreground);font-size:12px;line-height:1.9}.letter.empty{padding:120px 50px;text-align:center;font-family:var(--serif);font-size:21px}.history{color:var(--muted-foreground);font-size:11px;margin:23px 0 0}.history summary{list-style:none;cursor:pointer}.history summary::-webkit-details-marker{display:none}.history summary:after{content:" +";margin-left:4px}.history[open] summary:after{content:" −"}.history p{font-size:12px;line-height:1.9;margin-top:14px;padding-left:12px;border-left:1px solid var(--border)}
.popover{position:absolute;z-index:4;background:var(--popover);border:1px solid var(--border);border-radius:8px;box-shadow:0 9px 32px color-mix(in srgb,var(--foreground) 10%,transparent);padding:9px;min-width:204px;max-width:calc(100% - 24px)}.popover button{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;padding:10px 11px;gap:25px;border-radius:3px;font-size:12px}.popover button:hover,.popover button:focus-visible{background:var(--muted)}.popover hr{border:0;height:1px;background:var(--border);margin:7px 10px}.popover .menu-label{font-size:10px;color:var(--muted-foreground);padding:9px 11px 5px}.popover button.active{color:var(--primary)}.overlay{position:absolute;inset:0;z-index:6;background:color-mix(in srgb,var(--muted) 75%,transparent);backdrop-filter:blur(3px);padding:110px 24px 24px;display:flex;align-items:flex-start;justify-content:center}.dialog{background:var(--card);border:1px solid var(--border);border-radius:8px;box-shadow:0 15px 60px color-mix(in srgb,var(--foreground) 9%,transparent);width:100%;max-width:460px;overflow:hidden}.search-line{display:flex;align-items:center;gap:15px;padding:20px 23px;border-bottom:1px solid var(--border)}.search-line input{border:0;background:transparent;outline:none;min-width:0;flex:1;font-size:14px}.quiet-close{font-size:10px;color:var(--muted-foreground);padding:0}.results{padding:9px;max-height:350px;overflow:auto}.results button{width:100%;padding:12px 14px;text-align:left;display:flex;align-items:center;justify-content:space-between;gap:14px;font-size:12px;border-radius:3px}.results button:hover,.results button:focus-visible{background:var(--muted);outline:none}.results small{font-size:10px;color:var(--muted-foreground);flex:none}.compose-dialog{max-width:590px;padding:25px 29px}.compose-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.compose-top h2{font:24px var(--serif)}.field{display:flex;align-items:center;gap:15px;border-bottom:1px solid var(--border);padding:11px 0;font-size:12px}.field label{color:var(--muted-foreground);font-size:11px;flex:none;width:36px}.field input,.field select{background:transparent;min-width:0;flex:1;border:0}.compose-body{display:block;width:100%;min-height:180px;resize:vertical;background:transparent;border:0;padding:25px 0;font-size:14px;line-height:1.9}.compose-end{display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted-foreground)}.toast{position:absolute;z-index:8;bottom:22px;left:50%;transform:translateX(-50%);padding:12px 17px;background:var(--foreground);color:var(--card);border-radius:6px;font-size:11px;display:flex;gap:20px;align-items:center;max-width:calc(100% - 30px);white-space:nowrap;box-shadow:0 3px 12px color-mix(in srgb,var(--foreground) 10%,transparent)}.toast button{color:var(--card);font-size:11px;text-decoration:underline;text-underline-offset:4px}
@media(min-width:1200px){.workspace{grid-template-columns:290px minmax(0,1fr);height:760px}.list-heading{padding-left:36px;padding-right:36px}.threads{padding:0 24px}.list-footer{padding-left:36px;padding-right:36px}.letter{padding-top:46px}.subject-title{font-size:32px}.letter-body{font-size:15px}}
@media(max-width:850px){.workspace{grid-template-columns:218px minmax(0,1fr)}.list-heading{padding:22px 25px 25px}.threads{padding:0 13px}.list-footer{padding-left:25px;padding-right:25px}.letter{padding:39px 36px 35px}.subject-title{font-size:27px;line-height:1.65;letter-spacing:.03em}.letter-body{font-size:13px;line-height:2.05}.reading-tools{padding:0 28px}.thread .sender,.thread .subject{font-size:11px}.thread .when{display:none}.correspondent{margin-bottom:28px}}
@media(max-width:560px){.workspace{display:block;height:710px}.correspondence{height:710px}.reader{display:none}.workspace.reading .correspondence{display:none}.workspace.reading .reader{display:flex;height:710px}.reading-tools .back{display:block}.reading-tools{padding:0 27px}.letter{padding:26px 29px 35px}.subject-title{font-size:27px}.letter-body{font-size:14px}.list-heading{padding:19px 31px 29px}.threads{padding:0 19px}.thread{padding:20px 12px}.thread .sender{font-size:13px}.thread .subject{font-size:12px}.window-controls{padding-left:31px}.list-footer{padding:25px 31px}.overlay{padding:65px 12px 12px}.compose-dialog{padding:22px}.compose-body{min-height:180px}.compose-end{gap:12px;align-items:baseline}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media(prefers-reduced-transparency:reduce){.overlay{backdrop-filter:none;background:var(--muted)}}
</style>
</head>
<body>
<main class="window" id="window" aria-label="来信，交互原型">
<div class="workspace" id="workspace">
<aside class="correspondence" aria-label="来信列表">
<div class="window-controls" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="list-heading"><button class="mailbox-switch" id="mailbox-switch" aria-expanded="false">所有邮箱 <span class="small-chevron"></span></button><div class="list-title"><h1 id="view-title">来信</h1><button class="write-button" id="compose">写信</button></div></header>
<div class="threads" id="threads"></div>
<footer class="list-footer"><button class="search-button" id="search">搜索<kbd>⌘ K</kbd></button></footer>
</aside>
<section class="reader" aria-label="信件">
<header class="reading-tools"><button class="back" id="back">‹ 来信</button><button id="archive">归档</button><button class="more" id="more" aria-label="更多邮件操作" aria-expanded="false">···</button></header>
<div class="read-scroll" id="read-scroll"><article class="letter" id="letter"></article></div>
</section>
</div>
<div class="popover" id="popover" hidden></div>
<div class="overlay" id="search-overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-label="搜索与命令"><div class="search-line"><input id="query" placeholder="找一封信，或输入命令" aria-label="搜索与命令"><button class="quiet-close" id="search-close">关闭</button></div><div class="results" id="results"></div></section></div>
<div class="overlay" id="compose-overlay" hidden><section class="dialog compose-dialog" role="dialog" aria-modal="true" aria-labelledby="compose-title"><div class="compose-top"><h2 id="compose-title">写一封信</h2><button class="quiet-close" id="compose-close">关闭</button></div><div class="field"><label for="from">发件人</label><select id="from"><option value="work">工作邮箱 · alex@studio.example</option><option value="personal">个人邮箱 · alex@personal.example</option></select></div><div class="field"><label for="to">收件人</label><input id="to" type="email" placeholder="name@example.com"></div><div class="field"><label for="subject">主题</label><input id="subject"></div><textarea id="body" class="compose-body" aria-label="信件正文" placeholder="你好，"></textarea><div class="compose-end"><span>原型中的草稿，不会发送</span><button class="text-action" id="compose-save">保存草稿</button></div></section></div>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button id="undo" hidden>撤销</button></div>
</main>
<script>
const mail=[
{id:1,sender:'Maya Chen',initial:'M',address:'maya@fieldwork.example',account:'work',subject:'周一，我们从这里开始',snippet:'时间确认好了，带上你的想法就好。',time:'昨天',unread:false,pinned:true,folder:'inbox',body:['Alex，','周一上午十点，我们在工作室碰面。先一起看看这期的印刷样张，再聊聊冬季刊。','时间确认好了，带上你的想法就好。'],signature:'Maya',studio:'FIELDWORK STUDIO'},
{id:2,sender:'林 皓',initial:'林',address:'lin@fieldwork.example',account:'work',subject:'秋季刊，最后一遍校样',snippet:'封面和内页都准备好了，想听听你的意见。',time:'10:42',unread:true,pinned:false,folder:'inbox',body:['Alex，早上好。','新版校样整理好了。封面用了更温暖的纸色，内页留白也稍微放大了一些。','想请你最后看一遍，尤其是第 12 页的照片顺序。如果没有其他调整，我们周一就可以送印。','不用急，周末前回我就好。'],signature:'林皓',studio:'FIELDWORK STUDIO',attachment:'Fieldwork — 秋季刊.pdf',size:'8.4 MB',history:'收到样张了，纸张的手感比预期更好。'},
{id:3,sender:'Oliver Park',initial:'O',address:'oliver@park.example',account:'work',subject:'A few thoughts on the next chapter',snippet:'Thank you for the conversation yesterday.',time:'09:18',unread:true,pinned:false,folder:'inbox',body:['Hi Alex,','Thank you for the conversation yesterday. I kept thinking about the small details we discussed.','I put a few references together. Let’s find a quiet hour next week to go through them.'],signature:'Oliver',studio:'PARK & CO.'},
{id:4,sender:'Yuki',initial:'Y',address:'yuki@personal.example',account:'personal',subject:'周末，去海边走走？',snippet:'找到一家很小的咖啡店，就在灯塔旁边。',time:'08:56',unread:true,pinned:false,folder:'inbox',body:['周六有空吗？','找到一家很小的咖啡店，就在灯塔旁边。天气好的话，我们可以沿着海岸慢慢走过去。','我带相机，你选音乐。'],signature:'Yuki'},
{id:5,sender:'Linear',initial:'L',address:'notifications@linear.example',account:'work',subject:'本周的项目更新',snippet:'网站更新 · 3 个问题已解决',time:'昨天',unread:false,pinned:false,folder:'inbox',body:['本周的工作已整理。','网站的图片加载和移动端排版已经调整完成，剩余两项将在下周一起检查。'],signature:'Linear'},
{id:6,sender:'The Modern House',initial:'M',address:'journal@modernhouse.example',account:'personal',subject:'A slower kind of Sunday',snippet:'Spaces for living, and room to pause.',time:'昨天',unread:false,pinned:false,folder:'bundle',body:['A slower kind of Sunday.','This week, we visit a home where light and space do most of the talking. A place made for everyday rituals.'],signature:'The Modern House'},
{id:7,sender:'Dense Discovery',initial:'D',address:'hello@dense.example',account:'personal',subject:'Ideas worth keeping · № 312',snippet:'A small collection of considered things.',time:'昨天',unread:false,pinned:false,folder:'bundle',body:['A small collection of considered things.','This week: independent publishing, walkable cities, and the useful art of doing less.'],signature:'Dense Discovery'},
{id:8,sender:'Jun',initial:'J',address:'jun@studio.example',account:'work',subject:'冬季拍摄的时间',snippet:'明天 09:00 回到收件箱',time:'昨天',unread:false,pinned:false,folder:'snooze',snoozed:'明天 09:00',body:['Alex，','冬季拍摄的日期还可以调整。等你看过场地后，我们再一起确认。'],signature:'Jun'}
];const $=id=>document.getElementById(id);
const esc=text=>String(text).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let selected=2,view='inbox',account='all',bundleOpen=false,undoAction=null,toastTimer,menuAnchor=null,lastFocus=null,editingDraft=null;
const drafts=new Map();
const current=()=>mail.find(m=>m.id===selected);
const inAccount=m=>account==='all'||m.account===account;
const visible=()=>mail.filter(m=>inAccount(m)&&(view==='pin'?m.pinned&&m.folder!=='archive':view==='draft'?m.folder==='draft'||drafts.has(m.id):m.folder===view));
const names={inbox:'来信',pin:'置顶',snooze:'稍后',archive:'归档',draft:'草稿'};
function notify(message,undo){$('toast-text').textContent=message;undoAction=undo||null;$('undo').hidden=!undo;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4200)}
function row(m){return `<button class="thread ${m.id===selected?'selected':''} ${m.unread?'unread':''}" data-mail="${m.id}" aria-pressed="${m.id===selected}" title="${esc(m.account==='work'?'工作邮箱':'个人邮箱')} · ${esc(m.subject)}"><span class="sender">${esc(m.sender)}<time class="when">${m.time}</time></span><span class="subject">${esc(m.folder==='snooze'?m.snoozed+' · '+m.subject:m.subject)}</span></button>`}
function renderList(){const items=visible();$('view-title').textContent=names[view];$('mailbox-switch').innerHTML=(account==='all'?'所有邮箱':account==='work'?'工作邮箱':'个人邮箱')+' <span class="small-chevron"></span>';let html=items.map(row).join('');const bundles=mail.filter(m=>m.folder==='bundle'&&inAccount(m));if(view==='inbox'&&bundles.length)html+=`<div class="subscriptions"><button id="bundle" aria-expanded="${bundleOpen}">订阅来信<span>${bundleOpen?'−':'+'}</span></button>${bundleOpen?bundles.map(row).join(''):''}</div>`;$('threads').innerHTML=html||'<p class="empty">这里暂时没有来信。</p>';$('threads').querySelectorAll('[data-mail]').forEach(b=>b.onclick=()=>select(Number(b.dataset.mail)));if($('bundle'))$('bundle').onclick=()=>{bundleOpen=!bundleOpen;renderList()}}
function renderReader(){const m=current();$('archive').disabled=!m;$('more').disabled=!m;if(!m){$('letter').innerHTML='<p class="empty">暂时可以把邮件放一放。</p>';return}$('letter').innerHTML=`<div class="correspondent"><button class="sender-info" id="sender-info" aria-expanded="false">${esc(m.sender)}</button><time>${m.time==='昨天'?'11 月 13 日':'11 月 14 日'}</time></div><div class="envelope" id="envelope" hidden>来自 ${esc(m.address)}<br>发给 ${esc(m.to|| (m.account==='work'?'alex@studio.example':'alex@personal.example'))}<br>${m.account==='work'?'工作邮箱':'个人邮箱'}${m.pinned?' · 已置顶':''}</div><h2 class="subject-title">${esc(m.subject)}</h2><div class="letter-body">${m.body.map(p=>'<p>'+esc(p)+'</p>').join('')}</div><p class="signature">${esc(m.signature)}${m.studio?'<small>'+esc(m.studio)+'</small>':''}</p>${m.attachment?`<button class="attachment" id="attachment"><span class="filename">${esc(m.attachment)}</span><small>${m.size}</small><span aria-hidden="true">↗</span></button>`:''}<div class="reply"><button class="reply-open" id="reply-open"><span>${m.folder==='draft'?'继续写这封信':'回信给 '+esc(m.sender)}</span><span aria-hidden="true">↗</span></button><div id="reply-editor" hidden><div class="reply-label">${m.account==='work'?'工作邮箱':'个人邮箱'} → ${esc(m.sender)}</div><textarea id="reply-text" aria-label="回信正文" placeholder="写下你的回信…"></textarea><div class="reply-actions"><span>仅保存在此原型中</span><button class="text-action" id="reply-save">保存草稿</button></div></div></div>${m.history?`<details class="history"><summary>上一封往来</summary><p>${esc(m.history)}</p></details>`:''}`;
$('sender-info').onclick=()=>{const open=$('envelope').hidden;$('envelope').hidden=!open;$('sender-info').setAttribute('aria-expanded',String(open))};if($('attachment'))$('attachment').onclick=()=>notify('示例附件 · '+m.attachment);$('reply-open').onclick=()=>m.folder==='draft'?openCompose(m):openReply();$('reply-text').value=drafts.get(m.id)||'';$('reply-save').onclick=()=>{const text=$('reply-text').value.trim();if(!text)return;drafts.set(m.id,text);notify('回信已保存为示例草稿');renderList()}}
function render(){renderList();renderReader()}
function select(id){selected=id;if(current())current().unread=false;closeMenu();render();$('workspace').classList.add('reading');$('read-scroll').scrollTop=0}
function setView(next,acc=account){view=next;account=acc;selected=visible()[0]?.id??null;bundleOpen=false;render();closeMenu();$('workspace').classList.remove('reading')}
function changeFolder(folder,snoozed){const m=current();if(!m)return;const old={folder:m.folder,snoozed:m.snoozed};const list=visible(),index=list.indexOf(m);m.folder=folder;m.snoozed=snoozed;const remaining=visible();selected=remaining[Math.min(index,remaining.length-1)]?.id??null;closeMenu();render();notify(folder==='archive'?'已归档':snoozed+'回到来信',()=>{Object.assign(m,old);selected=m.id;render()})}
function pin(){const m=current();if(!m)return;m.pinned=!m.pinned;closeMenu();renderList();notify(m.pinned?'已置顶':'已取消置顶')}
function openReply(){if(!current())return;$('workspace').classList.add('reading');$('reply-open').hidden=true;$('reply-editor').hidden=false;$('reply-text').focus();$('reply-editor').scrollIntoView({block:'nearest'});closeMenu()}
function navigate(delta){const list=visible(),index=list.findIndex(m=>m.id===selected),next=list[index+delta];if(next)select(next.id)}
function closeMenu(restore=false){$('popover').hidden=true;menuAnchor?.setAttribute('aria-expanded','false');if(restore)menuAnchor?.focus()}
function menu(anchor,entries){if(menuAnchor===anchor&&!$('popover').hidden){closeMenu();return}closeMenu();menuAnchor=anchor;anchor.setAttribute('aria-expanded','true');$('popover').replaceChildren(...entries.map(entry=>{if(entry==='rule')return document.createElement('hr');if(typeof entry==='string'){const div=document.createElement('div');div.className='menu-label';div.textContent=entry;return div}const b=document.createElement('button');b.innerHTML='<span>'+esc(entry.label)+'</span><kbd>'+esc(entry.key||'')+'</kbd>';b.onclick=e=>{e.stopPropagation();entry.action()};return b}));const a=anchor.getBoundingClientRect(),w=$('window').getBoundingClientRect();$('popover').hidden=false;const width=$('popover').getBoundingClientRect().width;$('popover').style.left=Math.max(12,Math.min(a.left-w.left,w.width-width-12))+'px';$('popover').style.top=a.bottom-w.top+10+'px'}
function snooze(){if(!current())return;closeMenu();menu($('more'),['稍后回到来信',...['今天 18:00','明天 09:00','下周一 09:00'].map(time=>({label:time,action:()=>changeFolder('snooze',time)}))])}
function showMailbox(){menu($('mailbox-switch'),[{label:'所有邮箱',action:()=>setView('inbox','all')},{label:'工作邮箱',action:()=>setView('inbox','work')},{label:'个人邮箱',action:()=>setView('inbox','personal')},'rule',...['pin','snooze','draft','archive'].map(v=>({label:names[v],action:()=>setView(v)}))])}
const commands=()=>[{label:current()?.pinned?'取消置顶':'置顶这封信',key:'P',action:pin},{label:'稍后处理',key:'H',action:snooze},{label:'回复',key:'R',action:openReply},{label:'归档',key:'E',action:()=>changeFolder('archive')},{label:'所有来信',action:()=>setView('inbox','all')}];
function searchResults(){const q=$('query').value.trim().toLowerCase();const results=q?[...mail.filter(m=>(m.sender+' '+m.subject+' '+m.snippet).toLowerCase().includes(q)).map(m=>({label:m.subject,key:m.sender,action:()=>{view=m.folder==='bundle'?'inbox':m.folder;account='all';bundleOpen=m.folder==='bundle';select(m.id)}})),...commands().filter(c=>c.label.includes(q))]:commands();$('results').replaceChildren(...results.map(result=>{const b=document.createElement('button');b.innerHTML='<span>'+esc(result.label)+'</span><small>'+esc(result.key||'')+'</small>';b.onclick=e=>{e.stopPropagation();closeOverlay('search-overlay');result.action()};return b}));if(!results.length)$('results').innerHTML='<p class="empty">没有找到这封信。</p>'}
function openSearch(){closeMenu();lastFocus=document.activeElement;$('search-overlay').hidden=false;$('query').value='';searchResults();$('query').focus()}
function closeOverlay(id){$(id).hidden=true;lastFocus?.focus()}
function openCompose(m){closeMenu();lastFocus=document.activeElement;editingDraft=m?.id??null;$('from').value=m?.account||'work';$('to').value=m?.to||'';$('subject').value=m?.subject||'';$('body').value=m?.body.join('\n\n')||'';$('compose-overlay').hidden=false;$('to').focus()}
function saveCompose(){const to=$('to').value.trim(),subject=$('subject').value.trim(),text=$('body').value.trim();if(!to||!$('to').checkValidity()||!subject||!text){notify('请填写收件人、主题和正文');return}const data={sender:'我',address:$('from').value==='work'?'alex@studio.example':'alex@personal.example',to,account:$('from').value,subject,snippet:text,body:text.split('\n').filter(Boolean),signature:'Alex',time:'刚刚',folder:'draft',unread:false};let m=mail.find(m=>m.id===editingDraft);if(m)Object.assign(m,data);else{m={id:Math.max(...mail.map(m=>m.id))+1,...data};mail.push(m)}closeOverlay('compose-overlay');setView('draft','all');select(m.id);notify('已保存为示例草稿')}
$('mailbox-switch').onclick=showMailbox;$('more').onclick=()=>menu($('more'),commands().slice(0,4));$('archive').onclick=()=>changeFolder('archive');$('search').onclick=openSearch;$('compose').onclick=()=>openCompose();$('back').onclick=()=>$('workspace').classList.remove('reading');$('query').oninput=searchResults;$('search-close').onclick=()=>closeOverlay('search-overlay');$('compose-close').onclick=()=>closeOverlay('compose-overlay');$('compose-save').onclick=saveCompose;$('undo').onclick=()=>{undoAction?.();$('toast').hidden=true;undoAction=null};
$('search-overlay').onclick=e=>{if(e.target===$('search-overlay'))closeOverlay('search-overlay')};
document.addEventListener('click',e=>{if(!$('popover').contains(e.target)&&!menuAnchor?.contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.isComposing)return;const overlay=['search-overlay','compose-overlay'].find(id=>!$(id).hidden);if(overlay){if(e.key==='Escape'){e.preventDefault();closeOverlay(overlay)}else if(e.key==='Tab'){const controls=[...$(overlay).querySelectorAll('input,button,select,textarea')],i=controls.indexOf(document.activeElement);e.preventDefault();controls[(i+(e.shiftKey?-1:1)+controls.length)%controls.length]?.focus()}else if(overlay==='search-overlay'&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const buttons=[...$('results').querySelectorAll('button')],i=buttons.indexOf(document.activeElement);buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus()}else if(overlay==='search-overlay'&&e.key==='Enter'&&document.activeElement===$('query'))$('results').querySelector('button')?.click();return}
if(e.key==='Escape'){if(!$('popover').hidden)closeMenu(true);else $('workspace').classList.remove('reading');return}if(!$('popover').hidden&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();const buttons=[...$('popover').querySelectorAll('button')],i=buttons.indexOf(document.activeElement);buttons[(i+(e.key==='ArrowDown'?1:-1)+buttons.length)%buttons.length]?.focus();return}if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch();return}if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)||e.metaKey||e.ctrlKey||e.altKey)return;const action={j:()=>navigate(1),k:()=>navigate(-1),e:()=>changeFolder('archive'),p:pin,h:snooze,r:openReply,c:()=>openCompose()}[e.key.toLowerCase()];if(action){e.preventDefault();action()}});
render();
</script>
</body></html>
